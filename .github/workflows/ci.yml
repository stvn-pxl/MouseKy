name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-15
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Show toolchain
        run: xcodebuild -version

      - name: Build and test
        run: |
          set -o pipefail
          xcodebuild test \
            -project MouseKy.xcodeproj \
            -scheme MouseKy \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath .build-ci \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGN_STYLE=Manual

      - name: Build release configuration
        run: |
          xcodebuild build \
            -project MouseKy.xcodeproj \
            -scheme MouseKy \
            -configuration Release \
            -destination 'platform=macOS' \
            -derivedDataPath .build-ci \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGN_STYLE=Manual

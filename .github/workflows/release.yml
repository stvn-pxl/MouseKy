name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 45

    env:
      ARCHIVE_PATH: .build-release/MouseKy.xcarchive
      SPARKLE_VERSION: 2.10.0
      SPARKLE_ARCHIVE_SHA256: c2bf58aa8387266ac179357b1415d6f2635f044da8be41042af32425dae6da0c

    steps:
      - uses: actions/checkout@v5

      - name: Configure temporary paths
        run: |
          {
            echo "KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db"
            echo "P12_PATH=$RUNNER_TEMP/developer-id.p12"
            echo "API_KEY_PATH=$RUNNER_TEMP/AuthKey.p8"
          } >> "$GITHUB_ENV"

      - name: Validate tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Expected a semantic version tag such as v1.0.0" >&2
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Import Developer ID certificate
        env:
          P12_BASE64: ${{ secrets.DEVELOPER_ID_APPLICATION_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_APPLICATION_P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          printf '%s' "$P12_BASE64" | base64 -D > "$P12_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$P12_PATH" \
            -k "$KEYCHAIN_PATH" \
            -P "$P12_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"

          SIGNING_IDENTITY="$(
            security find-identity -v -p codesigning "$KEYCHAIN_PATH" |
              awk -F '"' '/Developer ID Application/ { print $2; exit }'
          )"
          if [[ -z "$SIGNING_IDENTITY" ]]; then
            echo "Developer ID Application identity not found" >&2
            exit 1
          fi
          echo "SIGNING_IDENTITY=$SIGNING_IDENTITY" >> "$GITHUB_ENV"

      - name: Prepare notarization key
        env:
          API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
        run: printf '%s' "$API_KEY_P8_BASE64" | base64 -D > "$API_KEY_PATH"

      - name: Archive universal app
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          xcodebuild archive \
            -project MouseKy.xcodeproj \
            -scheme MouseKy \
            -configuration Release \
            -archivePath "$ARCHIVE_PATH" \
            -destination 'generic/platform=macOS' \
            ARCHS='arm64 x86_64' \
            ONLY_ACTIVE_ARCH=NO \
            MARKETING_VERSION="$VERSION" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="$SIGNING_IDENTITY" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            OTHER_CODE_SIGN_FLAGS="--keychain $KEYCHAIN_PATH"

      - name: Verify app signature
        run: |
          APP_PATH="$ARCHIVE_PATH/Products/Applications/MouseKy.app"
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          lipo -archs "$APP_PATH/Contents/MacOS/MouseKy" | grep -q arm64
          lipo -archs "$APP_PATH/Contents/MacOS/MouseKy" | grep -q x86_64

      - name: Create signed DMG
        run: |
          APP_PATH="$ARCHIVE_PATH/Products/Applications/MouseKy.app"
          DMG_ROOT=".build-release/dmg"
          DMG_PATH=".build-release/MouseKy-$VERSION.dmg"
          mkdir -p "$DMG_ROOT"
          ditto "$APP_PATH" "$DMG_ROOT/MouseKy.app"
          ln -s /Applications "$DMG_ROOT/Applications"
          hdiutil create \
            -volname "MouseKy $VERSION" \
            -srcfolder "$DMG_ROOT" \
            -ov \
            -format UDZO \
            "$DMG_PATH"
          codesign --force --timestamp --sign "$SIGNING_IDENTITY" "$DMG_PATH"
          echo "DMG_PATH=$DMG_PATH" >> "$GITHUB_ENV"

      - name: Notarize and staple
        env:
          API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          xcrun notarytool submit "$DMG_PATH" \
            --key "$API_KEY_PATH" \
            --key-id "$API_KEY_ID" \
            --issuer "$API_ISSUER_ID" \
            --wait
          xcrun stapler staple "$ARCHIVE_PATH/Products/Applications/MouseKy.app"
          xcrun stapler validate "$ARCHIVE_PATH/Products/Applications/MouseKy.app"
          xcrun stapler staple "$DMG_PATH"
          xcrun stapler validate "$DMG_PATH"
          spctl --assess --type open --context context:primary-signature -vv "$DMG_PATH"

      - name: Download verified Sparkle tools
        run: |
          SPARKLE_TOOLS_ROOT=".build-release/sparkle-tools"
          SPARKLE_ARCHIVE="$SPARKLE_TOOLS_ROOT/Sparkle-$SPARKLE_VERSION.tar.xz"
          mkdir -p "$SPARKLE_TOOLS_ROOT"
          curl --fail --location --silent --show-error \
            "https://github.com/sparkle-project/Sparkle/releases/download/$SPARKLE_VERSION/Sparkle-$SPARKLE_VERSION.tar.xz" \
            --output "$SPARKLE_ARCHIVE"
          echo "$SPARKLE_ARCHIVE_SHA256  $SPARKLE_ARCHIVE" | shasum -a 256 --check
          tar -xf "$SPARKLE_ARCHIVE" -C "$SPARKLE_TOOLS_ROOT"
          echo "GENERATE_APPCAST=$SPARKLE_TOOLS_ROOT/bin/generate_appcast" >> "$GITHUB_ENV"

      - name: Create signed Sparkle update
        env:
          GH_TOKEN: ${{ github.token }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY_BASE64 }}
        run: |
          APP_PATH="$ARCHIVE_PATH/Products/Applications/MouseKy.app"
          UPDATE_DIR=".build-release/updates"
          UPDATE_ZIP="$UPDATE_DIR/MouseKy-$VERSION.zip"
          RELEASE_NOTES="$UPDATE_DIR/MouseKy-$VERSION.md"
          DOWNLOAD_URL="https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/"
          mkdir -p "$UPDATE_DIR"

          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "$UPDATE_ZIP"
          gh api \
            --method POST \
            "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
            -f tag_name="$GITHUB_REF_NAME" \
            --jq .body > "$RELEASE_NOTES"
          printf '%s' "$SPARKLE_PRIVATE_KEY" | "$GENERATE_APPCAST" \
            --ed-key-file - \
            --download-url-prefix "$DOWNLOAD_URL" \
            --link "https://github.com/$GITHUB_REPOSITORY" \
            --embed-release-notes \
            --maximum-deltas 0 \
            "$UPDATE_DIR"

          {
            echo "UPDATE_ZIP=$UPDATE_ZIP"
            echo "APPCAST_PATH=$UPDATE_DIR/appcast.xml"
            echo "RELEASE_NOTES=$RELEASE_NOTES"
          } >> "$GITHUB_ENV"

      - name: Validate Sparkle appcast
        run: |
          python3 - "$APPCAST_PATH" "$VERSION" "${{ github.run_number }}" \
            "https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/$(basename "$UPDATE_ZIP")" <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          appcast_path, version, build, expected_url = sys.argv[1:]
          sparkle = "http://www.andymatuschak.org/xml-namespaces/sparkle"
          item = ET.parse(appcast_path).find("./channel/item")
          if item is None:
              raise SystemExit("Sparkle appcast has no item")
          enclosure = item.find("enclosure")
          if enclosure is None:
              raise SystemExit("Sparkle appcast has no enclosure")
          if enclosure.get("url") != expected_url:
              raise SystemExit(f"Unexpected download URL: {enclosure.get('url')!r}")
          if item.findtext(f"{{{sparkle}}}shortVersionString") != version:
              raise SystemExit("Unexpected Sparkle release version")
          if item.findtext(f"{{{sparkle}}}version") != build:
              raise SystemExit("Unexpected Sparkle build number")
          if not enclosure.get(f"{{{sparkle}}}edSignature"):
              raise SystemExit("Sparkle appcast has no EdDSA signature")
          PY

      - name: Create checksums
        run: |
          cd .build-release
          shasum -a 256 "MouseKy-$VERSION.dmg" > "MouseKy-$VERSION.dmg.sha256"
          shasum -a 256 "updates/MouseKy-$VERSION.zip" > "MouseKy-$VERSION.zip.sha256"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "$DMG_PATH" \
            ".build-release/MouseKy-$VERSION.dmg.sha256" \
            "$UPDATE_ZIP" \
            ".build-release/MouseKy-$VERSION.zip.sha256" \
            "$APPCAST_PATH" \
            --title "MouseKy $VERSION" \
            --notes-file "$RELEASE_NOTES" \
            --verify-tag

      - name: Remove temporary credentials
        if: always()
        run: |
          security delete-keychain "$KEYCHAIN_PATH" 2>/dev/null || true
          rm -f "$P12_PATH" "$API_KEY_PATH"
